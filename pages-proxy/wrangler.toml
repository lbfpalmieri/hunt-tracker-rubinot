# Endereço curto e grátis (rubinothunt.pages.dev): um projeto do Cloudflare Pages
# que só repassa cada requisição para o Worker do app via service binding.
name = "rubinothunt"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[[services]]
binding = "APP"
service = "lbfpalmieri-hunt-tracker-rubinot"
